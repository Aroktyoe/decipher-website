<main>
  <div class="div1">
    <div class="title">AES encryption and decryption</div>
    <div class="left"><label for="text">Encrypt and decrypt text with AES algorithm that can only be decrypted using this webpage</label><br></div>
    <div class="minibox"><textarea id="text" rows="7" placeholder="Plain or encrypted text here"></textarea><br></div>
    <input type="text" id="password" placeholder=" Key of the encryption" autocomplete="off" class="full-width"><br>
    <div class="button-group">
      <button onclick="encrypt()" class="button encrypt">Encrypt</button>
      <button onclick="decrypt()" class="button decrypt">Decrypt</button>
      <center>
    <label id="resultLabel" for="result" style="display:none;">Result:</label><br>
    <textarea id="result" rows="4" cols="50" style="display:none;" readonly class="full-width"></textarea>
  </center>
  </div>

  </div>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script>
        function encrypt() {
            var text = document.getElementById("text").value;
            var password = document.getElementById("password").value;
            var paddedPassword = padPassword(password);
            paddedPassword = CryptoJS.enc.Utf8.parse(paddedPassword);
            var iv = CryptoJS.enc.Hex.parse("39bae7d6c97a4789fd1c29c6f14ce10b");
            var encrypted = CryptoJS.AES.encrypt(text, paddedPassword, { iv: iv }).toString();
            document.getElementById("result").value = encrypted;
            document.getElementById("result").classList.remove("unable-to-decrypt");
            document.getElementById("result").style.opacity = 1;
            document.getElementById("resultLabel").style.display = "block";
            document.getElementById("result").style.display = "block";
        }

        function decrypt() {
            var encryptedText = document.getElementById("text").value;
            var password = document.getElementById("password").value;
            var paddedPassword = padPassword(password);
            paddedPassword = CryptoJS.enc.Utf8.parse(paddedPassword);
            var iv = CryptoJS.enc.Hex.parse("39bae7d6c97a4789fd1c29c6f14ce10b");
            try {
                var decrypted = CryptoJS.AES.decrypt(encryptedText, paddedPassword, { iv: iv }).toString(CryptoJS.enc.Utf8);
                if (decrypted === '') {
                    throw new Error('Empty decryption result');
                }
                document.getElementById("result").value = decrypted;
                document.getElementById("result").readOnly = true;
                document.getElementById("result").style.opacity = 1;
            } catch (error) {
                document.getElementById("result").value = "Unable to decrypt";
                document.getElementById("result").readOnly = false;
                document.getElementById("result").classList.add("unable-to-decrypt");
                document.getElementById("result").style.opacity = 0.65;
            }
            document.getElementById("resultLabel").style.display = "block";
            document.getElementById("result").style.display = "block";
        }

        function padPassword(password) {
            var paddedPassword = password;
            var padding = "DECIPHER";
            while (paddedPassword.length < 32) {
                paddedPassword += padding;
                if (paddedPassword.length > 32) {
                    paddedPassword = paddedPassword.substring(0, 32);
                }
            }
            return paddedPassword;
        }
    </script>
