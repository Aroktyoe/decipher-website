  <div class="container">
    <h1>Leaderboard (top 50)</h1>
    <table>
      <thead>
        <tr>
          <th>Rank</th>
          <th>Username</th>
          <th>Puzzles Completed</th>
        </tr>
      </thead>
      <tbody id="leaderboard-list">
        <!-- Leaderboard data will be inserted here -->
      </tbody>
    </table>

    <a href="/puzzles.html" class="button2" style="text-decoration: none;">
      Back to Puzzles
    </a>
  </div>

  <script>
    async function fetchLeaderboard() {
      const res = await fetch("/leaderboard");
      if (res.ok) {
        const data = await res.json();
        const leaderboard = data.leaderboard.slice(0, 50);
        const leaderboardList = document.getElementById("leaderboard-list");

        leaderboard.forEach((entry, index) => {
          const row = document.createElement("tr");
          row.innerHTML = `
          <td style="color: white !important;">${index + 1}</td>
          <td style="color: white !important;">${entry.username}</td>
          <td style="color: white !important;">${entry.completed_puzzles}</td>
         `;

          leaderboardList.appendChild(row);
        });
      } else {
        alert("Failed to load leaderboard data.");
      }
    }

    window.onload = fetchLeaderboard;
  </script>
      <script src="https://decipher.wiki/compiledjs.js"></script>
