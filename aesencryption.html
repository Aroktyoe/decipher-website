<main>
  <div class="div1">
    <div class="title">aesencryption.net mimic (exact same encryption and decryption)</div>
    <div class="left"><label for="text">Encrypt and decrypt text with AES algorithm that can only be decrypted using this webpage and aesencryption.net</label><br></div>
    <div class="minibox"><textarea id="text" rows="7" placeholder="Plain or encrypted text here"></textarea><br></div>
    <input type="text" id="password" placeholder=" Key of the encryption" autocomplete="off" class="full-width"><br>
    <select id="keysize" class="full-width">
      <option value="16" selected>128-bit</option>
      <option value="32">256-bit</option>
    </select>
    <div class="button-group">
      <button onclick="encrypt()" class="button encrypt">Encrypt</button>
      <button onclick="decrypt()" class="button decrypt">Decrypt</button>
      <center>
    <label id="resultLabel" for="result" style="display:none;">Result:</label><br>
    <textarea id="result" rows="4" cols="50" style="display:none;" readonly class="full-width"></textarea>
  </center>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <script>
  function getKey() {
    const password = document.getElementById("password").value;
    const keySize = parseInt(document.getElementById("keysize").value);
    const keyBytes = CryptoJS.enc.Utf8.parse(password);
    return CryptoJS.lib.WordArray.create(keyBytes.words.slice(0, keySize / 4), keySize);
  }
  
  function getFixedIV() {
    return CryptoJS.enc.Utf8.parse("1234567890123456");
  }
  
  function encrypt() {
    const plaintext = document.getElementById("text").value;
    const key = getKey();
    const iv = getFixedIV();
  
    const encrypted = CryptoJS.AES.encrypt(CryptoJS.enc.Utf8.parse(plaintext), key, {
      iv: iv,
      mode: CryptoJS.mode.CBC,
      padding: CryptoJS.pad.Pkcs7
    });
  
    displayResult(encrypted.toString(), false); // already base64
  }
  
  function decrypt() {
    const ciphertext = document.getElementById("text").value;
    const key = getKey();
    const iv = getFixedIV();
  
    try {
      const decrypted = CryptoJS.AES.decrypt(ciphertext, key, {
        iv: iv,
        mode: CryptoJS.mode.CBC,
        padding: CryptoJS.pad.Pkcs7
      }).toString(CryptoJS.enc.Utf8);
  
      if (!decrypted) throw new Error();
      displayResult(decrypted, false);
    } catch {
      displayResult("Unable to decrypt", true);
    }
  }
  
  function displayResult(msg, isError) {
    const result = document.getElementById("result");
    result.value = msg;
    result.readOnly = true;
    result.classList.toggle("unable-to-decrypt", isError);
    result.style.opacity = isError ? 0.65 : 1;
    document.getElementById("resultLabel").style.display = "block";
    result.style.display = "block";
  }
  </script>
