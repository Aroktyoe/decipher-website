  <h1>Confirming your email...</h1>
  <div id="status">Please wait...</div>

  <script>

const params = new URLSearchParams(window.location.search);
const token = params.get("token");

if (!token) {
  document.getElementById("status").textContent = "❌ Missing token.";
} else {
  fetch("/confirm-email", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    credentials: "include",
    body: JSON.stringify({ token })
  })
  .then(res => {
    const status = res.ok;
    return res.json().then(data => ({ data, status }));
  })
  .then(({ data, status }) => {
    if (status) {
      document.getElementById("status").textContent = "✅ Email confirmed! Redirecting...";
      setTimeout(() => window.location.href = "/", 1000);
    } else {
      document.getElementById("status").textContent = "❌ " + (data.msg || "Something went wrong.");
    }
  })
  .catch(() => {
    document.getElementById("status").textContent = "❌ Network error.";
  });
}

  </script>
