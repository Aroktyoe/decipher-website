<style>
.morse-alphabet {
  background: #111;
  padding: 10px;
  font-size: 25px;
  line-height: 1.6;
  color: white;
  border: 1px solid #444;
  max-height: 80vh;
  overflow-y: auto;
  column-count: 2;
  column-gap: 30px;
  width: 300px;
  flex-shrink: 0;
  margin-right: -100px;
}

main {
  display: flex;
  justify-content: center;
  width: 100%;
}

.game-wrapper {
  display: flex;
  flex-direction: row;
  align-items: flex-start;
  gap: 5px;
  max-width: 1000px;
  width: 100%;
  margin: 0 auto;
}

.game-container {
  flex-grow: 1;
  max-width: 600px;
  width: 100%;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-left: 0px;
  margin-top: -50px;
}

.guess-row {
  display: flex;
  justify-content: center;
  margin: 5px 0;
}
.guess-cell {
  width: 60px;
  height: 60px;
  margin: 2px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  font-weight: bold;
  border: 2px solid #888;
}

.guess-cell.correct { background: #6aaa64; color: white; }
.guess-cell.present { background: #c9b458; color: white; }
.guess-cell.absent  { background: #787c7e; color: white; }

.morse-line.correct,
.morse-line.present,
.morse-line.absent {
  background: #6aaa64;
  color: white;
  padding: 4px 6px;
  margin: 2px 0;
  border-radius: 4px;
}
.morse-line.present { background: #c9b458; }
.morse-line.absent  { background: #787c7e; }

#input-area {
  margin-top: 20px;
}

#input-area button {
  font-size: 27px;
  padding: 8px 14px;
  margin: 5px 8px 5px 0;
  border: none;
  border-radius: 5px;
  background: #333;
  color: white;
  cursor: pointer;
}

#input-area button:hover {
  background: #555;
}

#copy-button {
  margin-top: 10px;
  display: none;
}

@keyframes shake {
  0% { transform: translateX(0); }
  20% { transform: translateX(-5px); }
  40% { transform: translateX(5px); }
  60% { transform: translateX(-5px); }
  80% { transform: translateX(5px); }
  100% { transform: translateX(0); }
}

.shake {
  animation: shake 0.4s;
}

#copy-button {
  padding: 10px 20px;
  font-size: 16px;
  background-color: #333;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.2s ease;
  left: 50%;
  display: block;
  margin: 10px auto;
}

#copy-button:hover {
  background-color: #555;
}

@media (min-width: 601px) {
  .game-wrapper {
    flex-direction: row;
    align-items: flex-start;
    justify-content: center;
    margin-left: -75px;
  }

  .morse-alphabet {
    order: -1;
    margin-left: -50px;
    margin-right: -100px;
  }

  .game-container {
    margin-left: 0; /* undo mobile offset if needed */
  }
}

@media (max-width: 600px) {
  .game-wrapper {
    flex-direction: column;
    align-items: center;
  }

  .morse-alphabet {
    column-count: 3;
    font-size: 18px;
    width: 100%;
    max-width: 600px;
    margin-top: 20px;
    margin-left: -30%;
    order: 1;
  }

  .game-container {
    margin: 0 auto;
    order: 0;
  }

  .guess-cell {
    width: 40px;
    height: 40px;
    font-size: 16px;
  }

  #input-area button {
    width: 48%;
    font-size: 22px;
    margin: 5px 5px 5px 0;
  }
}
