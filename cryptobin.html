	<main class="bg-light overflow-hidden">

		<noscript>
			<aside class="my-5">

					<div class="alert alert-warning m-0" role="alert">Please enable JavaScript before continuing.</div>
				</div>
			</aside>
		</noscript>

		<aside class="my-5 d-none" id="message-wrapper">
			<div class="container">
				<div class="alert alert-danger m-0 d-none" role="alert"></div>
				<div class="alert alert-warning m-0 d-none" role="alert"></div>
				<div class="alert alert-info m-0 d-none" role="alert"></div>
				<div class="alert alert-success m-0 d-none" role="alert"></div>
			</div>
		</aside>

		<section class="my-5" id="content-paste">
			<div class="container">
				<h2 class="d-none">New paste</h2>
				<form id="paste" method="POST" autocomplete="off">
				
					<div class="form-group">
						<label for="paste-text">Paste your text here</label>
						<textarea class="form-control" id="paste-text" name="pasteText" rows="10" autofocus></textarea>
					</div>

					<div id="paste-supplements">

						<div class="form-group">
							<label for="paste-password">Protect with a password</label>
							<div class="input-group">
								<input class="form-control rounded-pill" id="paste-password" name="pastePassword" type="password" aria-describedby="paste-generate-help">
								<div class="input-group-append">
									<button class="btn btn-secondary rounded-pill ml-2 px-md-5" id="paste-generate" type="button">Generate</button>
								</div>
							</div>
							<small id="paste-generate-help" class="text-muted d-none d-md-inline">
								<a href="https://en.wikipedia.org/wiki/Advanced_Encryption_Standard" target="_blank" rel="noopener noreferrer">AES-256</a> encryption is achieved client-side using <a href="https://crypto.stanford.edu/sjcl/" target="_blank" rel="noopener noreferrer">SJCL</a>.
							</small>
						</div>
						<div class="row no-gutters mt-5">
							<div class="col-md-4">
								<button class="btn btn-primary btn-block rounded-pill" id="paste-submit" type="button">Bin it</button>
							</div>
							<div class="col-md-2">
								<button class="btn btn-secondary btn-block rounded-pill mt-2 mt-md-0 ml-md-2" type="reset">Reset</button>
							</div>
						</div>

					</div>

				</form>
			</div>
		</section>

	</main>
