<!DOCTYPE html>
<html lang="en" xml:lang="en">
<head>    
    <title>Flip Images</title>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Language" content="en">
    <meta name="google" content="notranslate">
    <meta name="description" content="Flip Images Animation">
    <meta name="keywords" content="flip images, Shotcut, animation">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Neil (elusien.co.uk)">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Mono">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.3/gsap.min.js"></script>
    <style>
        :root {
            --screen_width     : 1920px;
            --screen_height    : 1080px;
            --screen_background: linear-gradient(to bottom, #bbbbbb 0%, #444444 100%);
            --image_width      : 1440px;
            --image_height     : 810px;
            --border_width     : 10px;
            --border_color     : white;
            --border_radius    : 1px;
            --initial_delay    : 1.5;
            --transition_time  : 2.5;
            --viewing_time     : 3;
            --flip_axis        : vertical;
            --perspective      : 2500px;
            --ease             : none;
            --ease_direction   : out;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }
        #screen {
            position: relative;
            width: var(--screen_width);
            height: var(--screen_height);
            background: var(--screen_background);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .button {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 24px;
            padding: 10px 20px;
            z-index: 100;
            background-color: #ffffff;
            border: 2px solid #cccccc;
            border-radius: 5px;
        }
        #btnPrev { left: 10px; }
        #btnNext { right: 10px; }
    </style>
</head>
<body>
    <div id="screen"></div>
    <button id="btnPrev" class="button" onclick="flipBack()">Flip Back</button>
    <button id="btnNext" class="button" onclick="flipForward()">Flip Forward</button>
    <script>
        "use strict";

        const images = ['blue.png', 'yellow.png', 'pink.png'];
        let currentIndex = 0;
        let flipcard;

        document.addEventListener('DOMContentLoaded', function() {
            flipcard = new Flipcard();
        });

        function flipForward() {
            if (currentIndex < images.length - 1) {
                currentIndex++;
                flipcard.flip();
            }
        }

        function flipBack() {
            if (currentIndex > 0) {
                currentIndex--;
                flipcard.flip();
            }
        }

        class Flipcard {
            constructor() {
                this.flipcard_div = document.getElementById('screen');
                this.setup();
            }

            setup() {
                let class_vh = "vert";
                let class_hf = "v_right";
                let class_b  = "v_left";

                this.flipcard_div.innerHTML = `<div class="flipcard">
                    <div class="flipcard-inner">
                        <div class="front ${class_vh}"><img src="${images[0]}" class="${class_hf}"></div>
                        <div class="back ${class_vh}"><img src="${images[1]}" class="${class_b}"></div>
                    </div>
                </div>`;
                this.flipcard_inner_div = this.flipcard_div.querySelector('.flipcard-inner');
                this.updateFlipcardSides();
            }

            flip() {
                let ease = `power1.out`;
                gsap.to(this.flipcard_inner_div, {rotateY: '-=180', duration: 2.5, ease: ease, onComplete: () => {
                    this.updateFlipcardSides();
                    this.flipcard_inner_div.style.transform = ''; // Reset rotation after flip
                }});
            }

            updateFlipcardSides() {
                const frontImg = this.flipcard_div.querySelector('.front img');
                const backImg = this.flipcard_div.querySelector('.back img');
                frontImg.src = images[currentIndex];
                backImg.src = images[(currentIndex + 1) % images.length];
            }
        }
    </script>
</body>
</html>
