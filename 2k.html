<style>
    body {
        font-family: Arial, sans-serif;
        color: #333;
        margin: 0;
        padding: 0;
    }
    #background-overlay {
        position: fixed;
        top: 0;

        background-position: center;
        filter: blur(10px);
        z-index: -1;

    #quiz-container {
        position: relative;
        z-index: 1;
        padding: 30px;
        margin: 50px auto;
        max-width: 300px;

    center {

}

#header-placeholder span, #header-placeholder .username {
  color: white !important;

    input[type="text"] {
        width: 200px;
        padding: 8px;
        margin-top: 5px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
    }
    button[type="submit"] {
        background-color: #007bff;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        margin-top: 10px;
    }
    button[type="submit"]:hover {
        background-color: #0056b3;
    }
    #result {
        margin-top: 40px;
        font-weight: bold;
    }

    /* Bounce animation for the result text */
    .bounce {
        animation: bounce 1s ease infinite alternate;
    }

    @keyframes bounce {
        0% { transform: translateY(0); }
        100% { transform: translateY(-10px); }
    }

<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.0.0/crypto-js.min.js"></script>

<body>
<!-- Google Tag Manager (noscript) -->

height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

    <div id="header-placeholder"></div>
<script>
  fetch("/header.html", { headers: { "X-Original-Request": "true" } })
    .then(res => res.text())
    .then(html => {
      document.getElementById("header-placeholder").innerHTML = html;
      console.log("✅ Header loaded");
      const script = document.createElement("script");
      script.src = "/header.js?v=" + Date.now();
      script.onload = () => {
        console.log("✅ Script loaded");
        setupHeader();
      };
      document.body.appendChild(script);
    });
</script>

<div id="background-overlay"></div>

<div id="quiz-container">
    <center>
        <h2>Level 1</h2>
        <p>flag format: DCTF{answer}</p>
        <p>it's spelled "ceasar" right?</p>
        <form onsubmit="return checkAnswer();">
            <label for="userInput">Enter Answer:</label><br>
            <input type="text" id="userInput" name="userInput"><br>
            <button type="submit">Submit</button>
        </form>
        <p id="result"></p>
    </center>
</div>

<script>
    function decryptLink(input) {
        try {
            var decryptedBytes = CryptoJS.AES.decrypt("U2FsdGVkX19K8Pq9yEg841kj6q+fkZCbiPBpAKZYF2HXnb45aAGaOQGoPhAADFuXWiamlV+57uMWHb3iILSsEkl+rR/jHKX/7kt7aUnBhIaA1coA50AAX9pUfcsu2/FD", input);
            var decryptedLink = decryptedBytes.toString(CryptoJS.enc.Utf8);
            return decryptedLink;
        } catch (e) {
            return '';
        }
    }

    function checkAnswer() {
        var userInput = document.getElementById("userInput").value;
        var decryptedLink = decryptLink(userInput);

        if (decryptedLink) {
            // Display success message and apply bounce animation
            var resultText = document.getElementById("result");
            resultText.innerText = "🎉 Congratulations! You've completed the level! 🎉";
            resultText.classList.add("bounce");

            // Redirect to the new site after a delay
            setTimeout(function() {
                window.location.href = decryptedLink;
            }, 1500); // Redirect after 1.5 seconds

            return false;
        } else {
            document.getElementById("result").innerText = "Incorrect!";
            return false;
        }
    }
</script>
</body>
