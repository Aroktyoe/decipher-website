    #tool-output { margin-top: 20px; }
    #canvas-output { display: block; max-width: 100%; margin-top: 15px; }
    textarea, input[type="text"], input[type="number"] {

    main.container section {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 12px;
  margin-top: 20px;
}

main.container section button {
  padding: 10px 16px;
  font-size: 14px;
  border: none;
  border-radius: 8px;
  background-color: #1a1a1a;
  color: #fff;
  cursor: pointer;
  box-shadow: 0 0 5px rgba(255,255,255,0.1);
  transition: background-color 0.2s;
}

main.container section button:hover {
  background-color: #333;
} 

.tool-box {
  margin-top: 20px;
}

#tool-input {
  width: 100%;
  height: 120px;
  font-size: 16px;
  padding: 10px;
  box-sizing: border-box;
  margin-bottom: 10px;
}

#tool-output {
  background: #111;
  color: #eee;
  padding: 10px;
  min-height: 60px;
  white-space: pre-wrap;
  border: 1px solid #333;
}

#canvas-output {
  display: block;
  max-width: 100%;
  margin-top: 15px;
}
#run-tool-button {
  margin-top: 10px;
  padding: 10px 16px;
  font-size: 14px;
  background-color: #2a2a2a;
  color: #fff;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}
#run-tool-button:hover {
  background-color: #444;
