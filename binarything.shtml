<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find the Needle</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.0.0/crypto-js.min.js"></script>
<style>
    body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
    }
    #haystack {
        position: relative;
        width: 100%;
        height: 100%;
        background-image: url('haystack.png');
        background-size: cover;
        cursor: pointer;
    }
    #needle {
        position: absolute;
        width: 20px;
        height: 40px; 
        bottom: 400px;
        left: 60%;
        transform: translateX(-50%);
    }
    #message {
        position: absolute;
        background-color: rgba(0, 0, 0, 0.7);
        color: white;
        padding: 5px 10px;
        border-radius: 5px;
        pointer-events: none;
        display: none;
    }
</style>
</head>
<body>
<!--#include virtual="/header.html" -->
<div id="haystack" onclick="checkClick(event)">
    <div id="needle" onclick="needleClick(event)"></div>
</div>
<div id="message"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.0.0/crypto-js.min.js"></script>
<script>
let messageTimeout;

function checkClick(event) {
    var x = event.clientX;
    var y = event.clientY;
    var screenWidth = window.innerWidth;
    var screenHeight = window.innerHeight;
    var marginX = screenWidth / 9;
    var marginY = screenHeight / 3.4;
    var extraClickableArea = 470;

    var needlePositionY = screenHeight - 20;
    var marginFromBottom = 180; // Adjust this value as needed
    var needlePositionX = screenWidth * 0.6;

    if (x > marginX && x < needlePositionX + extraClickableArea && y > marginY && y < needlePositionY - marginFromBottom) {
        showMessage("You have found hay and horse poop.", event.clientX, event.clientY);
    }
}


function unhex(data) {
    return new Uint8Array(data.match(/[\da-f]{2}/gi).map(function (h) {
        return parseInt(h, 16)
    }));
}

async function attemptUnlock() {
    const password = prompt("You found the needle! Enter the Needle Key:");

    if (password !== null) {
        const pbkdf = {
            salt: "07470ac8db53649141cf1d36e87adefe",
            iterations: 20000
        };

        const gcm = {
            nonce: "07470ac8db53649141cf1d36e87adefe",
            header: "07470ac8db53649141cf1d36e87adefe",
            tag: "8d56c67ad0e73df345a191ff67828e42"
        };

        const ciphertext = "4d86e7250fff40c1ab9da91ab17aea75d4421ee494f2a0afaf470cb7dce8c613536f2a135e95575495c115b6ee2e558de5ed";

        const keydata = await window.crypto.subtle.importKey(
            "raw",
            (new TextEncoder()).encode(password),
            { name: "PBKDF2" },
            false,
            ["deriveBits", "deriveKey"]
        );

        try {
            const key = await window.crypto.subtle.deriveKey(
                {
                    "name": "PBKDF2",
                    salt: unhex(pbkdf.salt),
                    "iterations": pbkdf.iterations,
                    "hash": "SHA-256"
                },
                keydata,
                { "name": "AES-GCM", "length": 128 },
                true,
                ["encrypt", "decrypt"]
            );

            const result = await window.crypto.subtle.decrypt(
                {
                    name: "AES-GCM",
                    iv: unhex(gcm.nonce),
                    tagLength: gcm.tag.length * 4,
                },
                key,
                unhex(ciphertext + gcm.tag)
            );

            alert("Decode: " + (new TextDecoder()).decode(result));
        } catch {
            alert("Incorrect password!");
        }
    }
}

function needleClick(event) {
    attemptUnlock();
    event.stopPropagation();
}

function showMessage(message, x, y) {
    var messageElement = document.getElementById("message");
    clearTimeout(messageTimeout); // Clear any existing timeout
    messageElement.textContent = message;
    messageElement.style.left = (x + 20) + "px";
    messageElement.style.top = (y - 20) + "px";
    messageElement.style.display = "block";
    
    messageTimeout = setTimeout(function() {
        messageElement.style.display = "none";
    }, 2000);
}
</script>
</body>
</html>
